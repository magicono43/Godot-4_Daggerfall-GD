; Initial DFU-source baseline. F3 reloads this file; F4 shows movement diagnostics.
; Baseline character values are stand-ins until the real attributes/skills exist.
[baseline]
speed_attribute=50.0
running_skill=25.0
jumping_skill=25.0
swimming_skill=25.0
climbing_skill=25.0

[locomotion]
; DFU FrictionMotor assigns horizontal velocity directly from input axes.
; "dfu_axes" reproduces DFU's Movement Acceleration input ramp.
; "smooth" enables independent acceleration/braking in metres/second squared.
response="instant"
axis_response_per_second=9.8
walk_multiplier=1.0
run_multiplier=1.0
strafe_multiplier=1.0
backward_multiplier=1.0
limit_diagonal_speed=true
ground_acceleration=24.0
ground_braking=32.0
air_control=false
air_acceleration=8.0
air_braking=8.0

[jump]
base_velocity=4.5
skill_bonus=0.5
athleticism_bonus=0.1
improved_athleticism_bonus=0.1
spell_bonus=0.6
forward_boost_fraction=0.05
minimum_grounded_time=0.1
repeat_while_held=true

[physics]
gravity=20.0
ground_stick_speed=0.2
floor_snap_metres=0.35
floor_max_angle_degrees=70.0
floor_constant_speed=false

[look]
; Retained Godot sensitivity, not a conversion of DFU's mouse sensitivity units.
radians_per_pixel=0.0023
max_pitch_degrees=83.0
invert_y=false

[stepping]
enabled=true
; DFU's player prefab uses a 0.5 m step offset. Zero disables assisted stepping.
max_height_metres=0.5
; Maximum visual catch-up speed in m/s.
camera_smoothing_speed=12.0
; Render-frame vertical follow rate (1/seconds). Lower softens stair motion.
camera_smoothing_rate=18.0

[effects]
athleticism=false
improved_athleticism=false
enhanced_jumping=false
enhanced_climbing=false
[climbing]
attach_delay_seconds=0.7689556

